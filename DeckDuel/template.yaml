AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DeckDuel - Real-time flashcard battle game

Globals:
  Api:
    Cors:
      AllowMethods: "'POST,GET,PUT,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"
  Function:
    Timeout: 10
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        DECKS_TABLE: !Ref DecksTable
        ROOMS_TABLE: !Ref RoomsTable
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${WebSocketStage}"
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient


Resources:

  # -------------------------------------------------------
  # DynamoDB Tables
  # -------------------------------------------------------

  DecksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: deckduel-decks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deckId
          AttributeType: S
      KeySchema:
        - AttributeName: deckId
          KeyType: HASH

  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: deckduel-rooms
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: roomId
          AttributeType: S
      KeySchema:
        - AttributeName: roomId
          KeyType: HASH

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: deckduel-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH

  # -------------------------------------------------------
  # Cognito
  # -------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: deckduel-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: preferred_username
          AttributeDataType: String
          Required: false
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: deckduel-client
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED

  # -------------------------------------------------------
  # IAM Role
  # -------------------------------------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: WebSocketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: "*"
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:GetUser
                  - cognito-idp:ListUsers
                Resource: "*"

  # -------------------------------------------------------
  # REST API Lambdas
  # -------------------------------------------------------

  CreateDeckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: createDeck.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        CreateDeck:
          Type: Api
          Properties:
            Path: /decks
            Method: post

  CreateRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: createRoom.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        CreateRoom:
          Type: Api
          Properties:
            Path: /rooms
            Method: post

  GetDecksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: getDecks.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        GetDecks:
          Type: Api
          Properties:
            Path: /decks
            Method: get

  GetDeckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: getDeck.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        GetDeck:
          Type: Api
          Properties:
            Path: /decks/{deckId}
            Method: get

  UpdateDeckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: updateDeck.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        UpdateDeck:
          Type: Api
          Properties:
            Path: /decks/{deckId}
            Method: put

  # -------------------------------------------------------
  # WebSocket API
  # -------------------------------------------------------

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: DeckDuelWebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true

  # --- Connect ---
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: connect.handler
      Role: !GetAtt LambdaExecutionRole.Arn

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub "integrations/${ConnectIntegration}"

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # --- Disconnect ---
  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: disconnect.handler
      Role: !GetAtt LambdaExecutionRole.Arn

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${DisconnectIntegration}"

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # --- JoinRoom ---
  JoinRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: joinRoom.handler
      Role: !GetAtt LambdaExecutionRole.Arn

  JoinRoomIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JoinRoomFunction.Arn}/invocations"

  JoinRoomRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: joinRoom
      Target: !Sub "integrations/${JoinRoomIntegration}"

  JoinRoomPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JoinRoomFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # --- SubmitAnswer ---
  SubmitAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: submitAnswer.handler
      Role: !GetAtt LambdaExecutionRole.Arn

  SubmitAnswerIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubmitAnswerFunction.Arn}/invocations"

  SubmitAnswerRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: submitAnswer
      Target: !Sub "integrations/${SubmitAnswerIntegration}"

  SubmitAnswerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubmitAnswerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
  # --- Auth ---
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: auth.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Auth:
          Type: Api
          Properties:
            Path: /auth
            Method: post
# --- Reaction ---
  ReactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: reaction.handler
      Role: !GetAtt LambdaExecutionRole.Arn

  ReactionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReactionFunction.Arn}/invocations"

  ReactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: reaction
      Target: !Sub "integrations/${ReactionIntegration}"

  ReactionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReactionFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
# -------------------------------------------------------
# Outputs
# -------------------------------------------------------

Outputs:
  ApiUrl:
    Description: "REST API endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"
  WebSocketUrl:
    Description: "WebSocket endpoint"
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref UserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref UserPoolClient